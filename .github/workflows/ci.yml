name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in app/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Test squad model
        run: pnpm test:squad

      - name: Test encounter runtime
        run: pnpm test:demo

      - name: Test motion
        run: pnpm test:motion

      - name: Test equipment
        run: pnpm test:equipment

      # Type-checks the app and the runtime, then bundles both entries.
      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 7

