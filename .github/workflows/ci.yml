name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from the packageManager field in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # Dependency lifecycle scripts stay off; the app builds without any (see pnpm.onlyBuiltDependencies).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm lint

      # The engine and squad packages on their own; the app build checks all three together.
      - run: pnpm typecheck

      # Squad model, encounter engine, and the app's asset-backed motion and equipment tests.
      - run: pnpm test

      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: app/dist
          retention-days: 7

  move:
    name: Move build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Matches toolchain-version in move/packages/*/Published.toml.
      SUI_VERSION: 1.82.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Sui CLI
        id: sui-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/sui
          key: sui-${{ runner.os }}-${{ runner.arch }}-${{ env.SUI_VERSION }}

      # Release binary from MystenLabs/sui, tag testnet-v<version>. The tarball is
      # large (~1.2 GB) and holds every node binary; only `sui` is extracted and cached.
      - name: Install Sui CLI
        if: steps.sui-cache.outputs.cache-hit != 'true'
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
            *) echo "unsupported arch" >&2; exit 1 ;;
          esac
          mkdir -p ~/.local/sui
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/testnet-v${SUI_VERSION}/sui-testnet-v${SUI_VERSION}-ubuntu-${arch}.tgz" \
            | tar -xz -C ~/.local/sui ./sui

      - name: Add Sui CLI to PATH
        run: |
          echo "$HOME/.local/sui" >> "$GITHUB_PATH"

      - run: sui --version

      # `r.mvr` dependencies resolve from the committed Move.lock files and git,
      # so the mvr CLI is not needed.
      - name: matchmaker
        working-directory: move/packages/matchmaker
        run: |
          sui move build --warnings-are-errors
          sui move test --warnings-are-errors

      - name: ghosts
        working-directory: move/packages/ghosts
        run: |
          sui move build --warnings-are-errors
          sui move test --warnings-are-errors

      # Dependencies must resolve to the revs recorded in Move.lock; a build that has to
      # rewrite either lock means a manifest changed without the lock being committed.
      - name: Move.lock is up to date
        run: git diff --exit-code -- move/packages/matchmaker/Move.lock move/packages/ghosts/Move.lock
