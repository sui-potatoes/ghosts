name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC: catches advisories published after the last code change.
    - cron: "17 6 * * 1"

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Lockfile and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs on the lockfile alone, before anything is installed.
      - name: Lockfile sources are registry + integrity only
        run: node scripts/check-lockfile.mjs

      # Source only, before install: no asset (font, script, style, image) may come from another origin.
      - name: No external assets in source
        run: node scripts/check-no-external-assets.mjs

      # The enforced CSP and companion headers in app/public/_headers must not be loosened or lost.
      - name: Content-Security-Policy is enforced and strict
        run: node scripts/check-csp.mjs

      # pnpm version comes from the packageManager field in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Fails if the lockfile is out of sync; dependency lifecycle scripts never run.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Gate: runtime dependencies with a high or critical advisory.
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

      # Informational: everything, dev tooling and moderate included. Never fails the job.
      - name: Full audit summary
        if: always()
        run: |
          {
            echo "### pnpm audit (all dependencies, informational)"
            echo
            echo '```'
            pnpm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Needs the repository's dependency graph enabled (Settings > Advanced Security).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Only vulnerabilities this PR newly introduces, and only high or worse.
          fail-on-severity: high
          fail-on-scopes: runtime
          # The repo is MIT. Only strong-copyleft network/linking licenses are refused;
          # LGPL, MPL and other weak copyleft stay allowed, and unknown licenses are not flagged.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: never
